name: Build FTEDroid APK

on:
  push:
    branches: [ master, main ] # Запуск сборки при каждом сохранении кода
  pull_request:
    branches: [ master, main ]

jobs:
  build-android:
    runs-on: ubuntu-20.04 # Используем стабильную Unix-среду

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Скачиваем все связанные подмодули

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11' # Для старого кода нужна Java 11
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install Specific Older NDK
      run: |
        # Древний ftedroid требует старый ndk-build (r21e или ниже идеален для стабильности)
        ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"

    - name: Build C++ Core via ndk-build
      run: |
        cd android
        # Указываем путь к установленному старом NDK
        ${ANDROID_SDK_ROOT}/ndk/21.4.7075529/ndk-build

    - name: Build Android Project
      run: |
        cd android
        # Если проект использует старый Gradle-оберточник
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: fteqw-android-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
